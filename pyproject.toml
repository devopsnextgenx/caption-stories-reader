[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caption-stories-reader"
dynamic = ["version"]
description = "Caption Stories Reader"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "Caption Stories Reader Team"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "paddlepaddle-gpu>=3.0.0,<=3.1.1",
    "paddleocr>=3.7.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "tqdm>=4.64.0",
    "numpy>=1.21.0,<2.0.0",
    "protobuf>=3.20.0,<5.0.0",
    "requests>=2.31.0",
    "fastapi>=0.124.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "qdrant-client>=1.7.0",
]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[[tool.uv.index]]
name = "paddlepaddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[project.urls]
Homepage = "https://github.com/devopsnextgenx/caption-stories-reader"
Repository = "https://github.com/devopsnextgenx/caption-stories-reader.git"
Issues = "https://github.com/devopsnextgenx/caption-stories-reader/issues"

[project.scripts]
caption-stories-reader = "src.main:main"

[tool.hatch.version]
path = "src/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"